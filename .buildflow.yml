default_step_timeout: 10m
# Vendored browser assets must never be reformatted or linted: oxfmt's
# webFilePatterns has no *.min.js exclude and pretty-printed htmx.min.js
# (1 line -> 3415) on two gate runs (2026-10-12). Global exclude wins.
exclude:
  - "*.min.js"
# Tool dispositions (2026-10-17 triage, TODO row "Buildflow tooling triage
# bundle"; full rationale in docs/buildflow-dev-gate.md):
# - lychee: needs the fleet GITHUB_TOKEN policy first (GitHub links in the
#   docs 401/429 without it) — excluded until that decision exists.
#   (markdownlint/prettier/eslint are NOT registered for this repo — the
#   doctor's fleet-wide ✗ marks never matched gate steps; dead skip_steps
#   entries are warned on, so they are documented, not listed.)
# - nix-build-verify: 12/12 failures on this machine (documented below and
#   in the gate doc); the equivalent check runs as the manual `nix build`
#   step of every receipt procedure, and statix/deadnix/flake-check still
#   cover the nix lane inside the gate.
# statix invocation contract (2026-10-18, rehearsals row): the gate runs
# BARE `statix check` (cwd = repo root, so the repo statix.toml applies —
# do NOT pass explicit targets, they bypass its `ignore` list). statix
# exits 0 on a config parse error and lints nothing: the no-op tripwire in
# scripts/verify-all.sh plus the CI nix-lane job grep stderr for the
# "config error" signature. Re-audit this contract whenever nixpkgs bumps
# statix (ROADMAP statix-bump watch).
skip_steps:
  - lychee
  - nix-build-verify
