name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  GO_VERSION: "1.27"
  GOLANGCI_LINT_VERSION: v2.14
  GOEXPERIMENT: jsonv2
  # Operator-zone determinism (R2): dashboard buckets and display renders
  # resolve Europe/Berlin; the golden snapshots were captured there, so CI
  # must render in the same zone or every Local() render diffs (the v0.2.0
  # CI red: 09:01 UTC vs 11:01 Berlin in page_detail.golden).
  TZ: Europe/Berlin

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Generate templ code
        # *_templ.go files are gitignored; regenerate from the go.mod-pinned
        # templ version (tool directive) before any step that compiles Go code.
        run: go tool templ generate

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -v -race -timeout 120s -coverprofile=cover.out ./...

      - name: End-to-end server probe
        # R17: the checked-in e2e (real listener over the registered mux on
        # loopback, all four surfaces) gets its own named step so the route
        # contract is a visible lane, not an implicit byproduct of ./...
        run: go test -race -timeout 60s -v -run 'TestLiveServerEndToEnd' ./internal/web

      - name: Backup restore drill
        # R16: the nightly snapshot path (VACUUM INTO snapshot → integrity
        # verify → restore into a fresh DSN → serve-startup FTS rebuild) is
        # the disaster-recovery proof; a named lane keeps it visible on
        # every push instead of an implicit byproduct of ./...
        run: go test -race -timeout 60s -v -run 'TestRestoreDrillSnapshotToFreshIndex' ./internal/backup

      - name: Check coverage threshold
        run: |
          MIN_COVERAGE=70
          # 70 pins the 2026-10-17 reality (total 71.9% after the cmd wiring
          # tests landed, cmd 9.2% -> 27.6%): 2pts of headroom, not a chase
          # target. Fleet 80 stays the aspiration; raising further is an
          # owner call (answer sheet D-question, coverage floor).
          COV=$(go tool cover -func=cover.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "total coverage: ${COV}%"
          rm -f cover.out
          if [ "$(echo "$COV < $MIN_COVERAGE" | bc -l)" = "1" ]; then
            echo "::error::Coverage below ${MIN_COVERAGE}% (got ${COV}%)"
            exit 1
          fi

      - name: Check go mod tidy
        run: |
          cp go.mod go.mod.bak && cp go.sum go.sum.bak
          go mod tidy
          diff go.mod go.mod.bak || (echo "go.mod is not tidy" && exit 1)
          diff go.sum go.sum.bak || (echo "go.sum is not tidy" && exit 1)
          rm -f go.mod.bak go.sum.bak

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Generate templ code
        run: go tool templ generate

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      - name: Nolint ledger check
        # Every //nolint: needs a why row in docs/nolint-ledger.md (matched
        # by file); keeps suppression rationale from silently rotting.
        run: bash scripts/check-nolint-ledger.sh

  govulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Generate templ code
        run: go tool templ generate

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  cqrs-lint:
    name: cqrs-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Generate templ code
        # cqrs-lint loads packages, so the gitignored *_templ.go must exist.
        run: go tool templ generate

      - name: Install cqrs-lint
        # Same master rev the flake devShell pins (flake.nix cqrs-lint);
        # the module has no stable tags. Errors fail the lane; the
        # documented warning/info decisions live in docs/cqrs-lint-policy.md.
        run: go install github.com/larsartmann/go-cqrs-lite/cmd/cqrs-lint/v4@afaffa19105b2422ef0722f156bca6d92169c529

      - name: Run cqrs-lint
        run: "$(go env GOPATH)/bin/cqrs-lint ."

  duplication:
    name: Code Duplication Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install art-dupl
        # Pinned to the fork commit that generated scripts/art-dupl-baseline.json
        # (the doc's law: the pin must match the baseline generator). The v0.9.0
        # tag predates the .templ code-fence detection fixes and false-positives
        # on 2-3 line markup fragments (2026-10-25 CI run 40165045608).
        run: go install github.com/LarsArtmann/art-dupl/cmd/art-dupl@93432fd

      - name: Gate new code duplication
        # Gate, not prose: scripts/art-dupl-baseline.json pins every accepted
        # clone group (acceptance table + refresh procedure:
        # docs/art-dupl-baseline.md). check fails ONLY on groups whose hash
        # is absent from the baseline, i.e. newly introduced duplication —
        # the 2026-10-24 audit's rule, enforced. The directory arg (.) is
        # load-bearing: explicit file lists shrink the detection universe
        # (.templ files are source and must be scanned; *_templ.go generated
        # code stays auto-excluded). --min-lines 2 is the calibration that
        # drove the report to zero: 1-line groups are signature/type
        # expression matches (parameter lists like (v string), not
        # duplication), so the gate contract is "zero clone groups; any new
        # multi-line clone goes red" (both directions proven 2026-10-24).
        # The pin must match the baseline generator; after a pin bump
        # regenerate the baseline in the same change:
        #   art-dupl baseline -t 4 --min-lines 2 . --baseline-path scripts/art-dupl-baseline.json
        run: art-dupl check -t 4 --min-lines 2 . --baseline-path scripts/art-dupl-baseline.json

  styles-freshness:
    name: Styles Freshness Guard
    runs-on: ubuntu-latest
    env:
      # Pinned to the nixpkgs tailwindcss_4 version the flake builds with;
      # cross-builder byte-determinism proven 2026-10-17 (npm 4.3.3 ==
      # nixpkgs 4.3.3, byte-identical, twice-run stable). When the flake
      # lock moves the nix version, bump this pin in the same change.
      TAILWIND_VERSION: "4.3.3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Regenerate styles.css with the pinned Tailwind
        # The committed styles.css must be byte-reproducible from the pinned
        # builder — the 2026-10-15 incident shipped a copy the pinned nix
        # builder never produced (foreign/unminified build). app.css resolves
        # `@import "tailwindcss"` from node_modules, so a scratch install is
        # symlinked at the repo root for the build and removed right after.
        run: |
          npm i --prefix /tmp/tw "tailwindcss@${TAILWIND_VERSION}" "@tailwindcss/cli@${TAILWIND_VERSION}" --no-fund --no-audit
          ln -sfn /tmp/tw/node_modules node_modules
          /tmp/tw/node_modules/.bin/tailwindcss -i internal/web/static/app.css -o /tmp/styles-regen.css --minify
          rm node_modules

      - name: Diff against the committed copy
        run: |
          diff internal/web/static/styles.css /tmp/styles-regen.css || {
            echo "::error::styles.css drifted from the pinned-builder output. Rebuild ONLY via 'nix run .#update-styles' and commit the result — never a foreign/unminified build (go:embed is compile-time)."
            exit 1
          }

  nix-lint:
    name: Nix Lint (statix + deadnix + treefmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the flake's locked nixpkgs
        # Every nix run below goes through the SAME nixpkgs rev the flake
        # locks, so a tool release can never change a verdict mid-green
        # (fleet hermeticity doctrine).
        run: echo "NIXPKGS_REF=$(nix flake metadata --json . | jq -r '.locks.nodes.nixpkgs.locked | "\(.type):\(.owner)/\(.repo)/\(.rev)"')" >> "$GITHUB_ENV"

      - name: statix check (with the no-op tripwire)
        # statix exits 0 on a config parse error and lints NOTHING — the
        # five-day silent outage of 2026-10-12..17 (docs/gotchas.md). The
        # tripwire greps stderr for the signature; the exit code then
        # carries the real findings verdict, matching BuildFlow's local
        # invocation (bare `statix check`, repo statix.toml applies).
        run: |
          set +e
          ERR="$(nix run "$NIXPKGS_REF"#statix -- check 2>&1 1>/dev/null)"
          RC=$?
          set -e
          case "$ERR" in
            *"config error"*)
              echo "::error::statix no-op: a config parse error exits 0 and lints nothing — fix statix.toml"
              echo "$ERR"
              exit 1
              ;;
          esac
          exit "$RC"

      - name: deadnix
        # --fail turns "unused declaration found" into a red lane (the
        # default exit code is 0 even with findings).
        run: nix run "$NIXPKGS_REF"#deadnix -- --fail .

      - name: treefmt CI check (nixfmt + deadnix + statix via the flake)
        # The flake's treefmt (nixfmt + deadnix + statix, frozen store
        # configs, templ fmt over the module's own go) must report zero
        # changes; also catches unparseable .nix that deadnix exits 0 on.
        run: nix fmt -- --ci
