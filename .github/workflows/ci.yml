name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  GO_VERSION: "1.27"
  GOLANGCI_LINT_VERSION: v2.14
  GOEXPERIMENT: jsonv2

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Generate templ code
        # *_templ.go files are gitignored; regenerate from the go.mod-pinned
        # templ version (tool directive) before any step that compiles Go code.
        run: go tool templ generate

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -v -race -timeout 120s -coverprofile=cover.out ./...

      - name: Check coverage threshold
        run: |
          MIN_COVERAGE=50
          # 50 is the measured floor (2026-10-11): packages sit at 76-94%, but
          # cmd/pbx-lens and internal/wire carry untested wiring (TODO_LIST:
          # httptest loop test, resolveKey/parseSince extraction). Raise this
          # to the fleet 80% gate when those land.
          COV=$(go tool cover -func=cover.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "total coverage: ${COV}%"
          rm -f cover.out
          if [ "$(echo "$COV < $MIN_COVERAGE" | bc -l)" = "1" ]; then
            echo "::error::Coverage below ${MIN_COVERAGE}% (got ${COV}%)"
            exit 1
          fi

      - name: Check go mod tidy
        run: |
          cp go.mod go.mod.bak && cp go.sum go.sum.bak
          go mod tidy
          diff go.mod go.mod.bak || (echo "go.mod is not tidy" && exit 1)
          diff go.sum go.sum.bak || (echo "go.sum is not tidy" && exit 1)
          rm -f go.mod.bak go.sum.bak

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Generate templ code
        run: go tool templ generate

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  govulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Generate templ code
        run: go tool templ generate

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  cqrs-lint:
    name: cqrs-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Generate templ code
        # cqrs-lint loads packages, so the gitignored *_templ.go must exist.
        run: go tool templ generate

      - name: Install cqrs-lint
        # Same master rev the flake devShell pins (flake.nix cqrs-lint);
        # the module has no stable tags. Errors fail the lane; the
        # documented warning/info decisions live in docs/cqrs-lint-policy.md.
        run: go install github.com/LarsArtmann/go-cqrs-lite/cmd/cqrs-lint/v4@afaffa19105b2422ef0722f156bca6d92169c529

      - name: Run cqrs-lint
        run: "$(go env GOPATH)/bin/cqrs-lint ."

  duplication:
    name: Code Duplication Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install art-dupl
        run: go install github.com/LarsArtmann/art-dupl/cmd/art-dupl@v0.6.2

      - name: Check for harmful code duplication
        run: |
          # Warning-only at t=4 (the fleet production gate): duplication here
          # surfaces for review instead of failing the lane.
          RESULT=$(find . -name '*.go' -not -path './vendor/*' | xargs art-dupl -t 4 2>/dev/null | wc -l)
          if [ "$RESULT" -gt 0 ]; then
            echo "::warning::Found $RESULT lines of duplication (t=4). Review needed."
          else
            echo "No harmful duplication detected (t=4 production gate)."
          fi
