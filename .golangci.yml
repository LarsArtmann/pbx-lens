version: "2"
run:
  timeout: 10m
  go: 1.27.1
  build-tags:
    - goexperiment.arenas
    - goexperiment.goroutineleakprofile
    - goexperiment.jsonv2
    - goexperiment.runtimesecret
    - goexperiment.simd
  allow-parallel-runners: true
  allow-serial-runners: true
  issues-exit-code: 1
output:
  formats: {}
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - gosmopolitan
    - grouper
    - iface
    - importas
    - inamedparam
    - interfacebloat
    - intrange
    - iotamixing
    - ireturn
    - lll
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - nlreturn
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - usestdlibvars
    - usetesting
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
    - zerologlint
  settings:
    cyclop:
      max-complexity: 12
    funlen:
      lines: 200
      statements: 100
    ginkgolinter:
      forbid-focus-container: true
      forbid-spec-pollution: true
    gocognit:
      min-complexity: 25
    goconst:
      ignore-tests: true
      min-len: 4
      min-occurrences: 5
    gocritic:
      disabled-checks:
        - ifElseChain
    gocyclo:
      min-complexity: 20
    gomoddirectives:
      replace-local: true
    gosec:
      excludes:
        - G304
        - G115
    ireturn:
      allow:
        - error
        - empty
        - anon
        - stdlib
        - generic
    makezero:
      always: true
    mnd:
      ignored-files:
        - _test\.go
    nestif:
      min-complexity: 6
    revive:
      rules:
        - disabled: true
          name: exported
        - disabled: true
          name: package-comments
    tagalign:
      align: false
      order:
        - binding
        - json
        - yaml
        - xml
        - toml
        - validate
        - mapstructure
      sort: true
    tagliatelle:
      case:
        rules:
          # Project convention: JSON wire and storage tags are snake_case
          # (matches the deployed sqlite JSON columns and the export API).
          json: snake
    testifylint:
      disable:
        - go-require
      enable-all: true
    varnamelen:
      ignore-decls:
        - err error
        - wg sync.WaitGroup
        - mu sync.Mutex
        - c context.Context
        - r *http.Request
        - w http.ResponseWriter
        - t *testing.T
        - b *testing.B
        - f *testing.F
        - db *sql.DB
        - tx *sql.Tx
        - ok bool
        - id string
        - n int
        - fn func()
        - i int
        - j int
      ignore-map-index-ok: true
      ignore-names:
        - err
        - ok
        - tt
        - fn
        - t
        - i
        - m
        - g
        - a
        - b
        - v
      ignore-type-assert-ok: true
      max-distance: 15
      min-name-length: 2
    wrapcheck:
      ignore-package-globs:
        # Own packages already classify errors via errorfamily; wrapping
        # again only buries the family code.
        - github.com/larsartmann/pbx-lens
        - github.com/larsartmann/pbx-lens/*
        # The cqrs stack's constructors return fully-contextualized errors.
        - github.com/larsartmann/go-cqrs-lite/*
        - github.com/larsartmann/go-error-family*
      ignore-sig-regexps:
        - encoding/json
        - fmt\.
        - errors\.
        - slices\.
        - maps\.
        - sort\.
        - time\.
        - net/http
        - os\.
        - io\.
        - strings\.
        - strconv\.
        - path\.
        - filepath\.
        - compress/gzip
        - \(context\.Context\)\.Err
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - .WithStack(
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - exhaustruct_v5
          - testpackage
          - gochecknoglobals
          - funlen
          - cyclop
          - goconst
          - forcetypeassert
          - gosec
          - errcheck
          - wrapcheck
          - ireturn
          - recvcheck
          - contextcheck
          - exhaustive
          # httptest.NewRequest without ctx is the stdlib test pattern;
          # context.Background() is implicit anyway.
          - noctx
          # Fleet precedent (go-output): table-driven stdlib tests gain
          # nothing from t.Parallel plumbing; fixtures are long CSV/JSON
          # literals; helper params are intentionally terse.
          - paralleltest
          - lll
          - unparam
          - varnamelen
      - path: _test\.go
        text: unused
        linters:
          - unused
      # The CLI's product IS terminal output (fleet precedent: go-output
      # exempts its examples/ the same way); internal/ stays print-free.
      - path: ^cmd/
        linters:
          - forbidigo
      # godoclint counts the "// templ: version:" header above `package X`
      # in every generated *_templ.go as an extra package doc (fleet
      # precedent: samber-do-auditlog hit the same false positive). The
      # package doc lives in queries.go; path exclusion cannot help because
      # the finding is reported on the doc-carrying file, not the generated
      # one.
      - text: package has more than one godoc
        linters:
          - godoclint
      # templ-generated component closures do not thread r.Context() into
      # child Render calls (the templ runtime owns that); contextcheck
      # reports the gap at the handler's render() call site. Framework
      # false positive — the ctx IS passed via render's r.Context().
      - path: ^internal/web/
        linters:
          - contextcheck
    paths:
      - \.gen\.go$
      - _templ\.go$
      - vendor/
formatters:
  enable:
    - gci
    - goimports
    - gofumpt
    - golines
  settings:
    golines:
      max-len: 120
  exclusions:
    generated: lax
    paths:
      - _templ\.go$
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
